[project]
name = "tms-dashboard-api"
version = "0.1.0"
description = "대시보드 API 서버 (최소 앱, D가 이어서 개발). 계약: specs/a-platform/009-service-infra/contracts/app-runtime.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "boto3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
