name: tms-collector

on:
  push:
    paths:
      - "services/tms-collector/**"
      - ".github/workflows/tms-collector.yml"
  pull_request:
    paths:
      - "services/tms-collector/**"
      - ".github/workflows/tms-collector.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tms-collector
    steps:
      - uses: actions/checkout@v4

      # 수집 Lambda 런타임과 같은 Python 3.13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install boto3 pytest

      - name: Test
        run: pytest -q
