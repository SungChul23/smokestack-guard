name: tms-silver

on:
  push:
    paths:
      - "services/tms-silver/**"
      - "src/smokestack_guard/silver/**"
      - ".github/workflows/tms-silver.yml"
  pull_request:
    paths:
      - "services/tms-silver/**"
      - "src/smokestack_guard/silver/**"
      - ".github/workflows/tms-silver.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tms-silver
    steps:
      - uses: actions/checkout@v4

      # Glue 5.0과 같은 Spark 3.5.4 / Java 17 / Python 3.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # C의 규칙 코드(src/smokestack_guard/silver)가 바뀌어도 진입 스크립트 테스트가 돈다.
      - name: Test
        run: pytest -q -m "not iceberg"

      # K-TMS(008) Iceberg 통합 테스트. Maven에서 Iceberg 1.7.1 jar를 받는다(Glue 5.0과 같은 버전).
      # jar를 붙인 SparkSession을 따로 띄워야 해서 별도 프로세스로 실행한다.
      - name: Test (Iceberg)
        run: pytest -q -m iceberg
