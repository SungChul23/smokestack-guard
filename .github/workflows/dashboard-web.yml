name: dashboard-web

# services/dashboard-web 이 바뀔 때만 돈다. PR은 빌드만, main 머지는 S3 업로드 + index.html 캐시 무효화.
# 계약: specs/a-platform/009-service-infra/contracts/deploy-pipeline.md
on:
  push:
    branches: [main]
    paths:
      - "services/dashboard-web/**"
      - ".github/workflows/dashboard-web.yml"
  pull_request:
    paths:
      - "services/dashboard-web/**"
      - ".github/workflows/dashboard-web.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_ROLE_ARN: arn:aws:iam::952900391026:role/tms-github-deploy
  WEB_BUCKET: smokestack-tms-web-952900391026

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/dashboard-web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: services/dashboard-web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dashboard-web
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 해시가 붙은 파일은 1년 캐시, index.html은 캐시하지 않는다.
      - name: Upload
        run: |
          aws s3 sync dist "s3://${WEB_BUCKET}/" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${WEB_BUCKET}/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate index.html
        run: |
          DIST_ID=$(aws ssm get-parameter --name /tms/app/config/web-distribution-id \
            --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/"
