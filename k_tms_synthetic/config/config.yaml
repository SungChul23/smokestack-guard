# 실행 공통 설정
run:
  seed: 20261109                # 난수 설정.
  generator_version: gen-v1     # 생성기 버전. 
  stats_version: provisional    # 참조 통계 버전
  snapshot_interval_min: 10     # snapshot 간격 (실제 수집기가 10분마다 api 호출)
  slot_min: 30                  # 측정 시각. 실측 측정값은 30분 간격으로 갱신
  episode_steps: 96             # 에피소드 길이(한 상황을 몇 번의 측정 칸으로 만들 것인가? -> 96 x 30(분) = 2일치 데이터). 
  warmup_stage: 12              # 워밍 업: 시나리오가 시작되기 전, 평범하게 지나가는 '준비 구간' (12칸 x 30분 = 6시간)
  start_kst: "추후설정"          # 첫 번째 측정값의 시각

# 참조 배출구 선택 조건
ref_selection:
  min_valid: 200                                            # 최소 측정 개수
  # 평범한 시나리오 조건(평소 값이 10~50 %), (직전 값과 얼마나 달랐는지), (100 번중 99번은 80% 아래인 굴뚝 -> 정상 기준선)
  normal: {mean: [10, 50], phi: [0.5, 0.95], p99_max: 80}   
  # 정해진 시나리오 조건(평소 80% 이하인 굴뚝), (정해진 모양의 첫 값이 평소 값에서 표준편차 2배 이내)
  trajectory: {p99_max: 80, first_value_within_sigma: 2.0}    

# 시나리오 개수 설정
episodes:
  S-01-E: 1   # 정상 기준선   | 계속 80% 미만으로 평온함 유지
  S-02-E: 3   # 서서히 상승   | 3시간 동안 62~92%로 올라감 (NOX, SOX, NOX+SOX 각 1개)
  S-03-E: 1   # 경계 오락가락 | 87, 91, 88, 92, 89, 91 (90% 경계를 오락 가락)
  S-04-E: 1   # 한 번에 초과  | 58% -> 113%로 갑자기 100% 초과
  S-05-E: 1   # 뛰었다 복귀   | 61%  -> 94% -> 63% (한 번만 기준 초과 후 돌아옴)
  S-06-E: 1   # 문자열 값     | "미수신", "1,047.55" 같은 숫자가 아닌 값
  S-07-E: 1   # 깨진 데이터   | 필드 누락, 잘린 JSON 등 
  S-08-E: 1   # 중복          | 같은 값이 여러번 반복해서 나타남
  S-09-E: 1   # 지연          | 값이 측정 시간보다 30, 60, 90분 늦게 나타남