# 실행 공통 설정
run:
  seed: 20261109                # 난수 설정.
  generator_version: gen-v1     # 생성기 버전. 
  stats_version: provisional    # 참조 통계 버전
  snapshot_interval_min: 10     # snapshot 간격 (실제 수집기가 10분마다 api 호출)
  slot_min: 30                  # 측정 시각. 실측 측정값은 30분 간격으로 갱신
  episode_steps: 96             # 에피소드 길이(한 상황을 몇 번의 측정 칸으로 만들 것인가? -> 96 x 30(분) = 2일치 데이터). 
  warmup_stage: 12              # 워밍 업: 시나리오가 시작되기 전, 평범하게 지나가는 '준비 구간' (12칸 x 30분 = 6시간)
  start_kst: "2026-11-20 09:00"          # 첫 번째 측정값의 시각

# 참조 배출구 선택 조건
ref_selection:
  min_valid: 200                                            # 최소 측정 개수
  # 평범한 시나리오 조건(평소 값이 10~50 %), (직전 값과 얼마나 달랐는지), (100 번중 99번은 80% 아래인 굴뚝 -> 정상 기준선)
  normal: {mean: [10, 50], phi: [0.5, 0.95], p99_max: 70}   
  # 정해진 시나리오 조건
  trajectory: 
    default: {p99_max: 70, first_value_within_sigma: 2.0}  # 첫 값이 정상 단계
    S-03: {p99_max: 100, first_value_within_sigma: 2.0}     # 첫 값이 주의, 경고 단계

# 시나리오 개수 설정
episodes:
  S-01-E: {items: [nox, sox]}                                       # 정상 기준선   | 계속 70% 미만으로 평온함 유지
  S-02-E:                                                           # 서서히 상승   
    episodes:                           
      - {suffix: NOX, items: [nox]}                                 # NOX 단독
      - {suffix: SOX, items: [sox]}                                 # SOX 단독
      - {suffix: NOXSOX-NOXUP, items: [nox, sox], rising: [nox]}    # NOX+SOX 에서 NOX만 상승
      - {suffix: NOXSOX-SOXUP, items: [nox, sox], rising: [sox]}    # NOX+SOX 에서 SOX만 상승
  S-03-E: {variants: [OVER, UNDER], items: [nox, sox]}              # 임계치 부근 진동 (OVER: 90% 넘나듦, UNDER: 90%미만에서 맴돎)
  S-04-E: {variants: [EXCEED, SPIKE, PLATEAU], items: [nox, sox]}   # 예고 없는 급등 | 초과, 유지, 일시적, 위험 유지
  S-05-E: {items: [nox]}                                            # 문자열 값   | 상태 문구, 콤마가 포함된 숫자
  S-06-E: {items: [nox]}                                            # 깨진 데이터 | 필드 누락, 잘린 JSON
  S-07-E: {variants: [SAME, CONFLICT], items: [nox]}                # 중복, 충돌  | 같은 값 반복, 같은 측정 다른 값
  S-08-E: {items: [nox]}                                            # 지연, 누락 